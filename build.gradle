plugins {
    id 'com.android.library' version '8.3.2'
}

android {
    namespace 'org.alee.wallpaper.multipicture'
    compileSdk 34

    defaultConfig {
        minSdk 7
        targetSdk 34
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
