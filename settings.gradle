pluginManagement {
    plugins {
        id 'com.android.library' version '8.3.2'
        id 'com.android.application' version '8.3.2'
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "MultiPictureLiveWallpaper"
include ':variant:free'
include ':variant:dnt'
