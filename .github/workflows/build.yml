name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant: [free, dnt]
        build_type: [debug, release, unsigned]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Install Android SDK platform 34
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            --licenses > /dev/null 2>&1 || true
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Decode release keystore
        if: matrix.build_type == 'release'
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > release.keystore
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Ensure debug keystore exists for unsigned builds
        if: matrix.build_type == 'unsigned'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build ${{ matrix.variant }} ${{ matrix.build_type }} APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ matrix.build_type }}"

          # Map 'unsigned' to Gradle's release build task
          GRADLE_BUILD_TYPE="${BUILD_TYPE}"
          if [[ "$BUILD_TYPE" == "unsigned" ]]; then
            GRADLE_BUILD_TYPE="release"
          fi

          TASK=":variant:${{ matrix.variant }}:assemble${GRADLE_BUILD_TYPE^}"

          if [[ "$BUILD_TYPE" == "release" && -f release.keystore ]]; then
            ./gradlew "$TASK" --no-daemon \
              -PRELEASE_STORE_FILE="${{ github.workspace }}/release.keystore" \
              -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          else
            # Runs unsigned release or debug build without keystore parameters
            ./gradlew "$TASK" --no-daemon
          fi

      - name: Sign unsigned APK with debug keystore for ADB
        if: matrix.build_type == 'unsigned'
        run: |
          # Generate default debug keystore if not present
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # Locate APK and sign with apksigner tool
          APK_PATH=$(find variant/${{ matrix.variant }}/build/outputs/apk/release/ -name "*.apk" | head -n 1)

          "${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            "$APK_PATH"

      - name: Upload ${{ matrix.variant }} ${{ matrix.build_type }} APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-${{ matrix.build_type }}
          path: |
            variant/${{ matrix.variant }}/build/outputs/apk/${{ matrix.build_type == 'unsigned' && 'release' || matrix.build_type }}/*.apk
          if-no-files-found: error
          retention-days: 30
